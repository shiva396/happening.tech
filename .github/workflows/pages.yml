name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.14.0
      - uses: actions/configure-pages@v6
        id: pages
      - run: dart pub get --enforce-lockfile
      - run: dart run tool/validate.dart
      - run: dart pub global activate jaspr_cli 0.24.0-beta.2
      - name: Build the static site
        env:
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          PUSH_SUBSCRIPTION_URL: ${{ vars.PUSH_SUBSCRIPTION_URL }}
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: >
          dart pub global run jaspr_cli:jaspr build
          --dart-define-server="SITE_BASE_PATH=$SITE_BASE_PATH"
          --dart-define-server="VAPID_PUBLIC_KEY=$VAPID_PUBLIC_KEY"
          --dart-define-server="PUSH_SUBSCRIPTION_URL=$PUSH_SUBSCRIPTION_URL"
          --dart-define-server="PROJECT_REPOSITORY=$GITHUB_REPOSITORY"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/jaspr

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      - uses: actions/checkout@v7
        if: github.ref == 'refs/heads/main' && vars.PUSH_SUBSCRIPTION_URL != ''
        with:
          fetch-depth: 0
      - name: Notify subscribers about new events
        if: github.ref == 'refs/heads/main' && vars.PUSH_SUBSCRIPTION_URL != ''
        env:
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_STORE_REPO: ${{ vars.PUSH_STORE_REPO }}
          PUSH_STORE_TOKEN: ${{ secrets.PUSH_STORE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          previous=$(gh run list --workflow pages.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          if [ -n "$previous" ] && git merge-base --is-ancestor "$previous" "$GITHUB_SHA"; then
            BEFORE_SHA="$previous" python3 tool/push/events.py > "$RUNNER_TEMP/new-events.json"
            npm ci --prefix tool/push --ignore-scripts
            node tool/push/send.mjs "$RUNNER_TEMP/new-events.json"
          fi
